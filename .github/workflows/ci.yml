name: CI

on:
  push:
  pull_request:

jobs:
  ruby:
    strategy:
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
      - run: ruby -c lib/later.rb
      - run: gem build later.gemspec
