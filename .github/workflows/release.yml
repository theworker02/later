name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rake test
      - run: gem build later.gemspec
      - run: ruby scripts/verify_gem later-*.gem
      - name: Attach gem to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${GITHUB_REF_NAME}"
          notes_file="RELEASE_NOTES_${release_tag}.md"
          create_args=(--title "$release_tag")
          case "$release_tag" in
            *.pre.*) create_args+=(--prerelease) ;;
          esac

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" later-*.gem --clobber
          elif [ -f "$notes_file" ]; then
            gh release create "$release_tag" later-*.gem "${create_args[@]}" --notes-file "$notes_file"
          else
            gh release create "$release_tag" later-*.gem "${create_args[@]}" --generate-notes
          fi
      - uses: rubygems/release-gem@v1
