name: Bug report
description: Report a reproducible problem
body:
  - type: input
    id: version
    attributes:
      label: later and Ruby version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and actual result
